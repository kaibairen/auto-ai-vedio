<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>N1 口播定稿</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a222c;
      --ink: #e8eef4;
      --muted: #93a1b1;
      --line: #2a3644;
      --accent: #5ee0b5;
      --warn: #f5c36e;
      --danger: #f07178;
      --chip: #243040;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font: 15px/1.5 ui-sans-serif, system-ui, "Noto Sans SC", sans-serif;
      background: var(--bg); color: var(--ink);
    }
    header {
      padding: 16px 20px; border-bottom: 1px solid var(--line);
      display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
    }
    header h1 { font-size: 18px; margin: 0; font-weight: 650; }
    header p { margin: 0; color: var(--muted); font-size: 13px; }
    main { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px; }
    @media (max-width: 960px) { main { grid-template-columns: 1fr; } }
    section {
      background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px;
    }
    h2 { font-size: 14px; margin: 0 0 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    label { display: block; font-size: 12px; color: var(--muted); margin: 8px 0 4px; }
    input, textarea, select {
      width: 100%; background: #0d1218; color: var(--ink); border: 1px solid var(--line);
      border-radius: 8px; padding: 8px 10px; font: inherit;
    }
    textarea { min-height: 110px; resize: vertical; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; }
    .row > div { flex: 1; min-width: 120px; }
    button {
      background: var(--accent); color: #072018; border: 0; border-radius: 8px;
      padding: 8px 12px; font-weight: 650; cursor: pointer;
    }
    button.ghost { background: var(--chip); color: var(--ink); }
    button.danger { background: var(--danger); color: #1a0808; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
    .chip { background: var(--chip); border-radius: 999px; padding: 2px 8px; font-size: 12px; }
    .chip.warn { color: var(--warn); }
    .chip.ok { color: var(--accent); }
    .msg { white-space: pre-wrap; background: #0d1218; border-radius: 8px; padding: 10px; font-size: 13px; }
    .fw { display: flex; flex-direction: column; gap: 6px; margin: 8px 0; }
    .fw label { color: var(--ink); font-size: 13px; }
    .banner { background: #3a2c12; color: var(--warn); padding: 8px 10px; border-radius: 8px; font-size: 13px; margin-bottom: 10px; }
    #err { color: var(--danger); min-height: 1.2em; font-size: 13px; }
    .candidates article { border: 1px solid var(--line); border-radius: 8px; padding: 8px; margin: 8px 0; }
    .count { font-size: 12px; color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>N1 口播定稿</h1>
      <p>单步向导 · 门 G1 仅 <code>POST /gates/g1/confirm</code> · ForcePass=never · 路径 B 跳过缺步 3</p>
    </div>
    <div class="chips" id="status"></div>
  </header>
  <main>
    <section>
      <h2>会话</h2>
      <div class="row">
        <div><label>project</label><input id="project" value="demo" /></div>
        <div><label>episode</label><input id="ep" value="EP01" /></div>
        <div>
          <label>path</label>
          <select id="path">
            <option value="A">A 口水话 ≤400</option>
            <option value="B">B 长文章 ≤500</option>
          </select>
        </div>
      </div>
      <div class="row" style="margin-top:10px">
        <button id="btnSession">创建会话</button>
        <button class="ghost" id="btnRefresh">刷新</button>
        <button class="ghost" id="btnDemo">Fixture 一键走通</button>
      </div>
      <p id="err"></p>
      <div id="banner"></div>
      <p id="stepLabel" class="msg">先创建会话。每步只提交当前 allowed_steps。</p>
      <div id="fields"></div>
      <div class="row" style="margin-top:10px">
        <button id="btnSubmit">提交本步</button>
      </div>
    </section>
    <section>
      <h2>候选 / 定稿 / 门 G1</h2>
      <div id="output" class="msg">等待输出</div>
      <div class="candidates" id="cands"></div>
      <label>标题</label>
      <input id="title" />
      <label>文案内容</label>
      <textarea id="body"></textarea>
      <p class="count" id="count"></p>
      <div class="row">
        <button class="ghost" id="btnDraft">保存草稿 PUT /n1/draft</button>
      </div>
      <label>actor（写入 confirmed_by）</label>
      <input id="actor" value="user:local" />
      <label>notes</label>
      <input id="notes" />
      <div class="row" style="margin-top:10px">
        <button id="btnPass">G1 通过</button>
        <button class="danger" id="btnReject">G1 驳回</button>
      </div>
      <p class="count">锁后不自动进编剧。下游读定稿用 GET /n1/final（未锁 409）。</p>
    </section>
  </main>
<script>
const $ = (id) => document.getElementById(id);
let view = null;

function api(path, opts = {}) {
  return fetch(path, {
    headers: { "Content-Type": "application/json", ...(opts.headers || {}) },
    ...opts,
  }).then(async (r) => {
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw Object.assign(new Error(data.message || r.statusText), { data, status: r.status });
    return data;
  });
}
function base() {
  return `/api/v0/projects/${$("project").value.trim()}/episodes/${$("ep").value.trim()}`;
}
function showErr(e) {
  $("err").textContent = e?.data ? `${e.status} ${e.data.error}: ${e.data.message}` : (e?.message || "");
}
function renderStatus() {
  if (!view) { $("status").innerHTML = ""; return; }
  const chips = [
    `path ${view.path || "-"}`,
    `state ${view.state}`,
    view.locked ? "locked" : "unlocked",
    `step ${view.current_step ?? "-"}`,
    `allowed ${(view.allowed_steps || []).join(",") || "—"}`,
  ];
  $("status").innerHTML = chips.map((c, i) =>
    `<span class="chip ${i === 2 && view.locked ? "ok" : ""}">${c}</span>`
  ).join("");
  $("banner").innerHTML = (view.path === "B")
    ? `<div class="banner">路径 B：教材缺第 3 步，向导跳过。不改 .prompt/koubo-长文章.md。</div>`
    : "";
}
function renderStep() {
  const spec = view?.step_spec;
  $("stepLabel").textContent = spec ? spec.label : (view?.gate?.status === "pending"
    ? "步骤已齐，编辑定稿后走门 G1。"
    : view?.locked ? "G1 已通过。next_edges 因 D2 未拍板保持 blocked。" : "创建会话后开始第 1 步。");
  const box = $("fields");
  box.innerHTML = "";
  if (!spec) return;
  const accepts = spec.accepts || [];
  if (accepts.includes("text")) {
    box.innerHTML += `<label>原料 text</label><textarea id="inText"></textarea>`;
  }
  if (accepts.includes("notes") || accepts.includes("confirm")) {
    box.innerHTML += `<label>notes</label><input id="inNotes" placeholder="可选修改意见" />`;
  }
  if (accepts.includes("frameworks") && spec.frameworks) {
    box.innerHTML += `<div class="fw" id="fw">${spec.frameworks.map((f) =>
      `<label><input type="checkbox" value="${f.name}" /> ${f.name}${f.defective ? "（源缺陷）" : ""} — ${f.summary}</label>`
    ).join("")}</div>`;
  }
  if (accepts.includes("pick")) {
    const n = (view.candidates || []).length || (view.titles || []).length || 5;
    box.innerHTML += `<label>pick index</label><input id="inPick" type="number" min="0" max="${Math.max(n-1,0)}" value="0" />`;
  }
  if (accepts.includes("title")) {
    box.innerHTML += `<label>title override</label><input id="inTitle" />`;
  }
}
function renderOut() {
  const parts = [];
  if (view?.step_result?.output?.message) parts.push(view.step_result.output.message);
  else if (view?.gate) parts.push(`门 ${view.gate.id} · ${view.gate.status}`);
  if (view?.analysis) parts.push("要点: " + JSON.stringify(view.analysis, null, 2));
  if (view?.titles?.length) parts.push("标题: " + view.titles.join(" / "));
  if (view?.next_edges?.length) parts.push("next_edges: " + view.next_edges.map(e => `${e.id}=${e.status}`).join(", "));
  $("output").textContent = parts.join("\n\n") || "等待输出";
  $("cands").innerHTML = (view?.candidates || []).map((c) =>
    `<article><strong>#${c.index} ${c.title}</strong> · ${c.framework} · ${c.chars}字<p>${c.body}</p></article>`
  ).join("");
  const d = view?.draft || {};
  if (d.title) $("title").value = d.title;
  if (d.body) $("body").value = d.body;
  updateCount();
}
function updateCount() {
  const n = ($("body").value || "").replace(/\s/g, "").length;
  const lim = view?.char_limit || 400;
  $("count").textContent = `字数 ${n} / ${lim}（机械校验，空白不计）`;
}
async function refresh() {
  try {
    view = await api(`${base()}/n1`);
    $("err").textContent = "";
    renderStatus(); renderStep(); renderOut();
  } catch (e) { showErr(e); }
}
$("btnSession").onclick = async () => {
  try {
    await api(`${base().replace(/\/episodes\/.*/, "")}/episodes`, {
      method: "POST", body: JSON.stringify({ ep: $("ep").value.trim() }),
    }).catch(() => {});
    view = await api(`${base()}/n1/sessions`, {
      method: "POST",
      body: JSON.stringify({ path: $("path").value, provider: "fixture" }),
    });
    $("err").textContent = "";
    renderStatus(); renderStep(); renderOut();
  } catch (e) { showErr(e); }
};
$("btnRefresh").onclick = refresh;
$("btnSubmit").onclick = async () => {
  if (!view?.allowed_steps?.length) return;
  const step = view.allowed_steps[0];
  const payload = { confirm: true };
  const t = $("inText"); if (t) payload.text = t.value;
  const n = $("inNotes"); if (n) payload.notes = n.value;
  const p = $("inPick"); if (p) payload.pick = Number(p.value);
  const ti = $("inTitle"); if (ti && ti.value) payload.title = ti.value;
  const fw = document.querySelectorAll("#fw input:checked");
  if (fw.length) payload.frameworks = [...fw].map((x) => x.value);
  try {
    view = await api(`${base()}/n1/steps/${step}/submit`, { method: "POST", body: JSON.stringify(payload) });
    $("err").textContent = "";
    renderStatus(); renderStep(); renderOut();
  } catch (e) { showErr(e); }
};
$("btnDraft").onclick = async () => {
  try {
    view = await api(`${base()}/n1/draft`, {
      method: "PUT",
      body: JSON.stringify({ title: $("title").value, body: $("body").value }),
    });
    $("err").textContent = "";
    renderStatus(); renderOut();
  } catch (e) { showErr(e); }
};
async function confirm(decision) {
  try {
    view = await api(`${base()}/gates/g1/confirm`, {
      method: "POST",
      body: JSON.stringify({ decision, actor: $("actor").value, notes: $("notes").value }),
    });
    $("err").textContent = "";
    renderStatus(); renderStep(); renderOut();
  } catch (e) { showErr(e); }
}
$("btnPass").onclick = () => confirm("pass");
$("btnReject").onclick = () => confirm("reject");
$("body").addEventListener("input", updateCount);
$("btnDemo").onclick = async () => {
  // Drive the same REST a bot uses, in-page.
  try {
    await $("btnSession").onclick();
    const rawA = "就是那个咖啡渣别扔啊，我妈说能除臭还能当肥料，我以前一直当垃圾倒了，后来才知道还能去油污。";
    const rawB = "很多人把长文章直接念完，观众三秒就滑走。真正能留下的口播，是一个痛点、一个转折、一个行动。";
    const path = $("path").value;
    const seq = path === "A" ? [1,2,3,4,5] : [1,2,4,5,6];
    for (const step of seq) {
      const payload = { confirm: true };
      if (step === 1) payload.text = path === "A" ? rawA : rawB;
      if (step === 3) payload.frameworks = ["惊喜揭秘型"];
      if (step === 5 && path === "A") payload.pick = 0;
      if (step === 5 && path === "B") { payload.frameworks = ["痛点共鸣式"]; payload.pick = 0; }
      view = await api(`${base()}/n1/steps/${step}/submit`, { method: "POST", body: JSON.stringify(payload) });
    }
    view = await api(`${base()}/gates/g1/confirm`, {
      method: "POST", body: JSON.stringify({ decision: "pass", actor: "user:local", notes: "wizard demo" }),
    });
    $("err").textContent = "";
    renderStatus(); renderStep(); renderOut();
  } catch (e) { showErr(e); }
};
</script>
</body>
</html>
